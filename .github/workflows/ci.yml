name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and install wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip install --force-reinstall dist/*.whl
      - name: Smoke-test installed CLI and packaged profile
        run: |
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/tree/kernel"
          printf 'void *f(unsigned long n) { return kmalloc(n, GFP_KERNEL); }\n' > "$workdir/tree/kernel/alloc.c"
          cd "$workdir"
          kernel-harness scan "$workdir/tree" --profile default --out "$workdir/out" --limit 5 --top 1
