<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="660"
     viewBox="0 0 1200 660"
     role="img"
     aria-labelledby="title desc"
     shape-rendering="geometricPrecision"
     text-rendering="optimizeLegibility">
  <title id="title">External Signal architecture for Kernel Codex Harness</title>
  <desc id="desc">Reproducible observations computed outside model inference prioritize kernel review targets. Manual or automated review produces a verdict and bounded next target, while human validation remains required.</desc>

  <defs>
    <marker id="arrow-blue"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-gray"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/>
    </marker>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      .box {
        fill: #ffffff;
        stroke: #1f2937;
        stroke-width: 2;
        vector-effect: non-scaling-stroke;
      }
      .box-soft {
        fill: #f8fafc;
        stroke: #1f2937;
        stroke-width: 2;
        vector-effect: non-scaling-stroke;
      }
      .box-accent {
        fill: #eff6ff;
        stroke: #1d4ed8;
        stroke-width: 3;
        vector-effect: non-scaling-stroke;
      }
      .header {
        fill: #e5e7eb;
        stroke: #1f2937;
        stroke-width: 2;
        vector-effect: non-scaling-stroke;
      }
      .header-dark {
        fill: #1f2937;
      }
      .header-blue {
        fill: #1d4ed8;
      }
      .lane {
        fill: #ffffff;
        stroke: #94a3b8;
        stroke-width: 2;
        vector-effect: non-scaling-stroke;
      }
      .step {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1.2px;
        fill: #111827;
      }
      .step-inverse {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1.2px;
        fill: #ffffff;
      }
      .box-title {
        font-size: 25px;
        font-weight: 700;
        fill: #111827;
      }
      .box-text {
        font-size: 18px;
        font-weight: 400;
        fill: #374151;
      }
      .lane-title {
        font-size: 21px;
        font-weight: 700;
        fill: #111827;
      }
      .lane-text {
        font-size: 17px;
        font-weight: 400;
        fill: #475569;
      }
      .principle {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.4px;
        fill: #1d4ed8;
      }
      .flow {
        fill: none;
        stroke: #1d4ed8;
        stroke-width: 3;
        stroke-linecap: square;
        stroke-linejoin: miter;
        marker-end: url(#arrow-blue);
        vector-effect: non-scaling-stroke;
      }
      .feedback {
        fill: none;
        stroke: #64748b;
        stroke-width: 2.5;
        stroke-dasharray: 9 7;
        stroke-linecap: square;
        stroke-linejoin: miter;
        marker-end: url(#arrow-gray);
        vector-effect: non-scaling-stroke;
      }
      .feedback-label {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.6px;
        fill: #475569;
      }
      .boundary {
        fill: #fff7ed;
        stroke: #c2410c;
        stroke-width: 2;
        vector-effect: non-scaling-stroke;
      }
      .boundary-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #9a3412;
      }
      .boundary-text {
        font-size: 18px;
        font-weight: 600;
        fill: #7c2d12;
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="658" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>

  <!-- 01: fixed inputs -->
  <rect x="50" y="65" width="300" height="170" rx="8" class="box"/>
  <path d="M58 65 H342 Q350 65 350 73 V105 H50 V73 Q50 65 58 65 Z" class="header"/>
  <text x="72" y="92" class="step">01  INPUTS</text>
  <text x="72" y="142" class="box-title">Source &amp; Scope</text>
  <text x="72" y="181" class="box-text">Linux source tree + profile</text>
  <text x="72" y="213" class="box-text">Optional cached syzbot JSON</text>

  <!-- 02: named core philosophy -->
  <rect x="430" y="45" width="340" height="210" rx="8" class="box-accent"/>
  <path d="M438 45 H762 Q770 45 770 53 V89 H430 V53 Q430 45 438 45 Z" class="header-blue"/>
  <text x="452" y="75" class="step-inverse">02  PRIORITIZE</text>
  <text x="452" y="133" class="box-title">External Signal</text>
  <text x="452" y="172" class="box-text">Computed before model inference</text>
  <text x="452" y="204" class="box-text">Path · lexical · cached syzbot</text>
  <text x="452" y="236" class="principle">GUIDES ATTENTION — NOT PROOF</text>

  <!-- 03: reproducible unit -->
  <rect x="850" y="65" width="300" height="170" rx="8" class="box"/>
  <path d="M858 65 H1142 Q1150 65 1150 73 V105 H850 V73 Q850 65 858 65 Z" class="header"/>
  <text x="872" y="92" class="step">03  SESSION</text>
  <text x="872" y="142" class="box-title">Ranked Review Unit</text>
  <text x="872" y="181" class="box-text">Manifest + prompts + snippets</text>
  <text x="872" y="213" class="box-text">Reproducible from fixed inputs</text>

  <!-- 04: two review modes -->
  <rect x="100" y="340" width="520" height="170" rx="8" class="box-soft"/>
  <path d="M108 340 H612 Q620 340 620 348 V380 H100 V348 Q100 340 108 340 Z" class="header-dark"/>
  <text x="122" y="368" class="step-inverse">04  FOCUSED REVIEW</text>

  <rect x="125" y="405" width="220" height="80" rx="6" class="lane"/>
  <text x="145" y="436" class="lane-title">Manual</text>
  <text x="145" y="466" class="lane-text">One focused target</text>

  <rect x="375" y="405" width="220" height="80" rx="6" class="lane"/>
  <text x="395" y="436" class="lane-title">Autopilot</text>
  <text x="395" y="466" class="lane-text">Time budget · read-only</text>

  <!-- 05: stateful ingestion -->
  <rect x="760" y="340" width="340" height="170" rx="8" class="box"/>
  <path d="M768 340 H1092 Q1100 340 1100 348 V380 H760 V348 Q760 340 768 340 Z" class="header-dark"/>
  <text x="782" y="368" class="step-inverse">05  INGEST</text>
  <text x="782" y="418" class="box-title">Verdict &amp; State</text>
  <text x="782" y="450" class="box-text">1 next target / response</text>
  <text x="782" y="479" class="box-text">Manual follow-ups ≤ 2</text>
  <text x="782" y="497" class="lane-text">Responses · logs · findings</text>

  <!-- primary flow -->
  <path d="M350 150 H420" class="flow"/>
  <path d="M770 150 H840" class="flow"/>
  <path d="M1000 235 V290 H360 V330" class="flow"/>
  <path d="M620 425 H750" class="flow"/>

  <!-- bounded state feedback -->
  <path d="M930 510 V540 H360 V520" class="feedback"/>
  <rect x="536" y="526" width="198" height="23" fill="#ffffff"/>
  <text x="635" y="543" text-anchor="middle" class="feedback-label">BOUNDED NEXT TARGET</text>

  <!-- human validation remains outside automated proof -->
  <rect x="50" y="570" width="1100" height="60" rx="6" class="boundary"/>
  <text x="76" y="606" class="boundary-title">HUMAN VALIDATION</text>
  <text x="338" y="607" class="boundary-text">Reachability  →  invariant break  →  concrete impact</text>
</svg>
